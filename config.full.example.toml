# Unicorn Viz — Full Example Configuration
#
# This is an exhaustive, documented template intended as a reference.
# For day-to-day use, keep config.toml minimal and only override what you need.

[window]
width = 1920
height = 1080
fullscreen = false
show_cursor = false   # true keeps pointer visible by default; Ctrl still reveals when false
title = "Unicorn Viz"
display_mode = "single"      # single | span_included | span_all | mirror_included | mirror_all
display_index = 0             # raw SDL display index used by single mode
exclude_display_indices = []  # raw SDL display indices ignored only by *_included modes

[demo]
# "sequential" or "random"
mode = "sequential"
# seconds per effect in auto-playlist mode
effect_duration = 20
# transition: crossfade, smoothfade, scanwipe_x, scanwipe_y, dissolve,
# zoomblend, or shuffle/random (pick transition each switch)
transition = "crossfade"
transition_duration = 1.0

[audio]
# empty string = auto-detect best source
device = ""
fft_bands = 512
buffer_seconds = 10.0
reactivity = 1.0
# low, medium, high
latency = "high"
# Silence gate (RMS).  Inputs below silence_rms_floor are treated as
# silent; the spectrum scales 0 → 1 over the next silence_rms_span of RMS.
# Raise these if quiet background noise registers as signal.
silence_rms_floor = 0.0060
silence_rms_span  = 0.045

[midi]
# empty string disables MIDI
# set a substring to match/open a specific input device
# Audio frequency response profile: house (default), trance, electronic, rap,
# hyphy, r&b, rock, generic, classical, ambient, pop, metal
profile = "house"
device = ""

[logging]
# DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# directory for per-run log files
directory = "logs"

[dropins]
# Global drop-in exclusion list for dependency testing / support triage.
# Values:
# - "none" (default): enable all drop-ins
# - "all": disable all drop-ins
# - comma-separated drop-in names, e.g. "webcam-01,postfx-01"
exclude = "none"
safe_mode = false

[hotkeys]
# F6 randomizes effect speed within this range (when effect exposes `speed`)
random_speed_min = 0.25
random_speed_max = 2.50
# F7 randomizes audio reactivity within this range
random_reactivity_min = 0.40
random_reactivity_max = 2.00
# Alt+[/] adjusts zoom; Shift+Z randomizes within this range
zoom_min = 0.1
zoom_max = 3.0
random_zoom_min = 0.30
random_zoom_max = 1.80

[streaming]
enabled = false
auto_start = false
provider = "rumble"
endpoint = "rtmp://live-api-s.rumble.com/live"
stream_key = ""
rumble_endpoint = "rtmp://live-api-s.rumble.com/live"
youtube_endpoint = "rtmp://a.rtmp.youtube.com/live2"
custom_endpoint = "rtmp://your.rtmp.server/live"
# Optional full URL override (when set, endpoint/stream_key are ignored)
stream_url = ""
ffmpeg_path = "ffmpeg"
fps = 60
video_codec = "libx264"
preset = "veryfast"
pixel_format = "yuv420p"
include_audio = true
audio_input_format = "pulse"
audio_input_device = ""
audio_codec = "aac"
audio_bitrate = "160k"

[streaming.cta]
enabled = true
duration_s = 4.5
cooldown_s = 0.0
mode = "cycle"               # cycle | random
seed = 0
messages = [
	"Push the buttons!|👍",
	"Do the thangs!|🔔",
	"Share the love!|❤️ 📤",
]

[spotify]
enabled = false
player = "spotify"
poll_interval_s = 0.75
command_timeout_s = 0.25
now_playing_banner = true
now_playing_banner_hold_s = 10.0
# Optional live corpus sink for runtime training rows.
# live_corpus_file = "assets/training/corpus/live-corpus.jsonl"

[spotify.web_api]
enabled = false
client_id = ""
redirect_uri = "http://127.0.0.1:43879/callback"
scopes = [
	"user-read-playback-state",
	"user-read-currently-playing",
	"playlist-read-private",
	"playlist-read-collaborative",
]
token_store = "runtime/spotify-token.json"
poll_interval_s = 1.0
resolve_queue = true
resolve_playlist_context = true
# PKCE local flow does not require a client secret in runtime config.

[postfx]
enabled = true
active_slot = 0
hit_duration = 0.9
slot1_duration = 1.15
slot2_duration = 0.95
slot3_duration = 0.90
slot4_duration = 1.30
slot5_duration = 1.05
slot6_duration = 1.20
slot7_duration = 0.95
slot8_duration = 0.90
slot9_duration = 0.85
slot10_duration = 2.40
hue_shift_timeout_s = 3.0
hue_shift_step = 0.0277777778
rotation_timeout_s = 3.0
rotation_step_rad = 0.07

[grand_finale]
intensity = 1.0
blackout_s = 15.0

[candy_frame]
enabled = true
start_enabled = false
inset_px = 96.0
intensity = 1.0
pattern_interval_s = 120.0
reverse_on_cycle = true
outer_fill_mode = "auto"     # auto | mirror_blur | reactive_gradient | off
outer_fill_rotate_s = 24.0
outer_fill_mix = 0.84
seed = 0

[auto_vj]
enabled = false
beat_tracker_engine = "v2"   # v2 (default) | legacy
profile = "normie"   # chill | normie | raver | user
auto_profile_enabled = false
log_decisions = false

