# ── projectM affinity & extended dwell ──────────────────────────────────────
# Controls how often the Auto VJ biases toward ProjectM Presets and how long
# it lingers there.  These keys live inside [auto_vj] and respect per-profile
# overrides.
#
# projectm_affinity = 0.30              # 0 = disabled; 1 = always pick projectM
# projectm_dwell_mult = 2.0             # multiply dwell timer when projectM wins
# projectm_preset_min_interval_s = 6.0  # min secs between Auto-VJ preset changes
# projectm_preset_on_event_chance = 0.75 # chance of random preset on drop/impact/etc

# ── Preset-level ping-pong inside projectM (raver only) ─────────────────────
# When enabled, the Auto VJ bounces between two random projectM presets for a
# run of N beats instead of swapping whole effects.
#
# projectm_preset_pingpong_enabled = true
# projectm_preset_pingpong_beats = 4
# projectm_preset_pingpong_min_swaps = 4
# projectm_preset_pingpong_max_swaps = 10

# ── Post-FX ping-pong (raver only, layered) ──────────────────────────────────
# Accelerating oscillator: fires slot A at full natural duration, then B as A
# concludes, each subsequent swap shorter by decay factor until min_interval is
# reached, then finale plays the last slot at full duration and exits.
# Runs simultaneously with effect/preset ping-pong.
#
# postfx_pingpong_enabled = true
# postfx_pingpong_decay = 0.68           # per-swap multiplier; lower = faster
# postfx_pingpong_min_interval_s = 0.12  # floor (s) — finale fires at this point
# postfx_pingpong_trigger_chance = 0.40

# Drop-in activation model (applies to the sections below):
#   enabled        — load the drop-in at all (default true: "drop it in and go").
#   start_enabled  — whether the feature is *active* at boot. Defaults are safe:
#                    only color_grade starts on; audio_out/beat_flash/osc/lyrics
#                    load ready-but-idle and are switched on by their hotkey.

# ── audio-out-01 — audio playback / SFX injection with DJ-deck FX ────────────
# App-owned audio OUTPUT path (separate from the audio capture pipeline). Plays
# an optional looping music bed plus one-shot "folley" SFX through a live filter
# + EQ + reverb chain. Loaded by default but silent until start_enabled / the
# Ctrl+Shift+Alt+O hotkey opens the output stream.
[audio_out]
enabled = true
start_enabled = false       # engine stays silent until toggled on
# device = "default"        # output device name/index; omit for system default
samplerate = 44100
blocksize = 1024
master_gain = 0.9           # 0.0–1.5 output trim
smoothing = 0.15            # 0–1 per-block parameter glide (higher = snappier)
# Filter + 3-band EQ start values (all real-time tweakable via hotkeys/OSC):
hpf_hz = 20.0               # high-pass cutoff (20 = open/bypassed)
lpf_hz = 20000.0            # low-pass cutoff (>=Nyquist = open/bypassed)
eq_low_db = 0.0             # low-shelf gain  (-18..+18 dB)
eq_mid_db = 0.0             # mid-peak gain   (-18..+18 dB)
eq_high_db = 0.0            # high-shelf gain (-18..+18 dB)
reverb_room = 0.7           # 0–1 room size (comb feedback)
reverb_wet = 0.0            # 0–1 wet mix (0 = dry/bypassed)
# Folley / one-shot SFX:
sfx_dir = "assets/audio/sfx"  # dir of .wav/.flac/.ogg samples (relative to app root)
max_voices = 16
# music_file = "assets/audio/loop.wav"  # optional looping music bed
music_loop = true
# Beat-synced folley triggering:
beat_trigger = false
# beat_sfx = "clap"         # SFX name (filename stem) to fire on beat; blank = random
beat_min_interval_s = 0.18

# ── color-grade-01 — global colour-grade / LUT post pass ─────────────────────
# A persistent post-FX pass (after postfx) applying a procedural "look" or an
# Adobe .cube 3D LUT to the whole frame, blended by intensity. Loaded and active
# by default (a passive aesthetic pass). Built-in looks: Neutral, Teal & Orange,
# Warm Sunset, Cool Night, Noir, Vibrant Pop, Faded Film, Cyberpunk, Neon Rave,
# Acid Wash. Drop Adobe .cube files in assets/luts/ to add more.
[color_grade]
enabled = true
start_enabled = true        # passive grade applied at boot; Ctrl+Shift+Alt+L off
intensity = 0.85            # 0–1 blend against the ungraded frame
default_grade = "random"    # built-in look name, LUT file stem, or "random"
# lut_dir = "assets/luts"   # optional dir of Adobe .cube 3D LUTs (this is the default)

# ── beat-flash-01 — BPM-locked strobe with photosensitivity safety governor ──
# Flashes the frame on detected beats (drawn last, on top of any colour grade).
# Loaded by default but start_enabled stays FALSE for photosensitivity safety —
# the operator opts in with Ctrl+Shift+Alt+B. ALL limits are hard-capped by the
# runtime governor: max_hz <= 3.0 (WCAG/ITU general-flash threshold),
# max_brightness <= 0.8, flashes never overlap. Ceilings can't be raised here.
[beat_flash]
enabled = true
start_enabled = false        # OFF at boot (photosensitivity); opt in via hotkey
max_hz = 3.0                 # hard-capped at 3.0
max_brightness = 0.7         # hard-capped at 0.8
flash_duration = 0.12        # seconds; clamped below the min inter-flash interval
beat_division = 1            # flash every Nth beat
mode = "full"                # full | edge | pulse
color = [1.0, 1.0, 1.0]      # flash colour (RGB 0–1)
beat_threshold = 0.45        # beat rising-edge trigger threshold

# ── dj-mixer-01 — two-deck DJ mixer window + Pioneer DDJ-REV1 ────────────────
# Loaded when enabled, but stays fully idle: the mixer window, the audio output
# stream, and the REV1 MIDI port are all left alone until you open the mixer
# with Shift+D — a single action that brings up the window + REV1 + audio
# together (the REV1 is a raw-only aux device that coexists with a VJ-side
# controller). Esc closes and releases it all. See drop-ins/dj-mixer-01/README.md.
[dj_mixer]
enabled = true               # load the drop-in (idle until Shift+D)
start_enabled = false        # open the mixer (window + REV1 + audio) at boot
rev1_device = "rev1"         # MIDI port-name substring for the DDJ-REV1
music_dir = ""               # folder scanned for tracks (browse encoder + LOAD)
led_feedback = true          # REV1 LED feedback while the mixer is open
beat_flash = true            # PLAY button pulses on its track's beat while playing
pad_lightshow = true         # performance pads light the deck's set hot cues
vu_idle_seconds = 120        # idle this long (no non-volume input) -> pads
                             #   become a VU meter; any interaction (except the
                             #   volume faders) stops it. 0 disables the VU.
samplerate = 48000
blocksize = 512              # lower = tighter jog; higher = safer against underruns
pitch_range = 0.08           # tempo fader range (±8%)
display_index = 1            # display the mixer window opens on
fullscreen = false           # borderless full-display window when true
width = 1280                 # windowed size when not fullscreen
height = 800

# ── osc-bridge-01 — OSC control surface (TouchOSC / Ableton / Max) ───────────
# Exposes runtime tweakables over OSC. Inbound server runs on a daemon thread;
# actions execute on the main thread once per frame. Loaded by default but the
# UDP server is not bound until start_enabled / the Ctrl+Shift+Alt+9 hotkey.
# Bind host = "0.0.0.0" only on trusted networks (OSC is unauthenticated).
# Address scheme is documented in drop-ins/osc-bridge-01/README.md.
[osc]
enabled = true
start_enabled = false       # server stays unbound until toggled on
host = "127.0.0.1"          # inbound bind address
port = 9000                 # inbound UDP port
feedback = false            # publish /uv/state/bpm and /uv/state/beat
send_host = "127.0.0.1"     # outbound feedback host
send_port = 9001            # outbound feedback port

# ── lyrics-01 — synced lyrics overlay (LRCLIB) ───────────────────────────────
# Time-synced lyrics for the current track, sourced from LRCLIB (NOT Spotify;
# Spotify has no public lyrics API). Now-playing is read from the spotify
# subsystem if present, else playerctl/MPRIS. Loaded by default; the overlay
# stays hidden until start_enabled / the Ctrl+Shift+Alt+Y hotkey.
[lyrics]
enabled = true
start_enabled = false       # overlay hidden until toggled on
offset_ms = 0               # sync nudge; positive shows lines earlier
font_px = 40
max_lines = 1
poll_interval_s = 0.5
cache_dir = "runtime/lyrics"
player = "spotify"          # playerctl player for the MPRIS fallback
provider = "lrclib"         # only LRCLIB is supported
