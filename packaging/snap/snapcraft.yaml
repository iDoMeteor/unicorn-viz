name: unicorn-viz
base: core22
version: '0.1.0'
summary: Audio-reactive demoscene visualizer
description: |
  Unicorn Viz is a fullscreen OpenGL visualizer with audio-reactive effects,
  ANSI art rendering, and MIDI controls.

grade: devel
confinement: devmode
license: MIT

apps:
  unicorn-viz:
    command: bin/unicorn-viz
    plugs:
      - opengl
      - x11
      - wayland
      - audio-playback
      - audio-record

parts:
  unicorn-viz:
    plugin: python
    source: ../..
    requirements:
      - requirements.txt

  # Attribution: MIT/BSD/Apache dependencies require their notices to travel
  # with any binary distribution.  Regenerate THIRD_PARTY_LICENSES.md with
  # tools/gen_third_party_licenses.py when requirements.txt pins change.
  licenses:
    plugin: dump
    source: ../..
    organize:
      LICENSE: usr/share/doc/unicorn-viz/LICENSE
      THIRD_PARTY_LICENSES.md: usr/share/doc/unicorn-viz/THIRD_PARTY_LICENSES.md
    stage:
      - usr/share/doc/unicorn-viz/LICENSE
      - usr/share/doc/unicorn-viz/THIRD_PARTY_LICENSES.md
