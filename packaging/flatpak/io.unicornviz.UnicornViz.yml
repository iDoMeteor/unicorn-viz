app-id: io.unicornviz.UnicornViz
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: unicorn-viz
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
modules:
  - name: unicorn-viz
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --prefix=/app .
      # Attribution: MIT/BSD/Apache dependencies require their notices to
      # travel with any binary distribution.  Regenerate THIRD_PARTY_LICENSES.md
      # with tools/gen_third_party_licenses.py when pins change.
      - install -Dm644 LICENSE /app/share/licenses/io.unicornviz.UnicornViz/LICENSE
      - install -Dm644 THIRD_PARTY_LICENSES.md
        /app/share/licenses/io.unicornviz.UnicornViz/THIRD_PARTY_LICENSES.md
    sources:
      - type: dir
        path: ../..
