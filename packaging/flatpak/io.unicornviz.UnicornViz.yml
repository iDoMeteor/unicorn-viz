# Flatpak manifest for Unicorn Viz (installer plan §5.1 / §18 Block D).
#
# The app module consumes the *release tarball* published by
# tools/packaging/release.sh (the same artifact install.sh installs), never the
# repository tree: the working tree carries gigabytes of gitignored training data
# and licensed asset packs that must not enter a build. Python dependencies are
# pinned offline in python3-requirements.json as manylinux WHEELS (Flathub accepts
# wheels for heavy scientific stacks; building numpy/scipy/OpenCV from source in
# the sandbox is a toolchain project of its own), generated from requirements.txt
# minus pysdl2-dll (the runtime's own libSDL2 is used; the launcher points PySDL2
# at it via PYSDL2_DLL_PATH). python-rtmidi ships no Python 3.13 wheel, so its
# sdist is built in the sandbox with --no-build-isolation against meson-python +
# Cython wheels installed just before it. Regenerate when pins change:
#
#   flatpak run --share=network --filesystem=/var/tmp --command=sh org.freedesktop.Sdk//25.08 -c \
#     'python3 -m pip download --only-binary=:all: --dest /var/tmp/wheels -r <requirements minus pysdl2-dll,python-rtmidi>;
#      python3 -m pip download --no-deps --no-binary=:all: --dest /var/tmp/wheels python-rtmidi==<pin>;
#      python3 -m pip download --only-binary=:all: --dest /var/tmp/wheels "meson-python>=0.16" "Cython>=3" pyproject-metadata packaging "meson>=1.0" ninja'
#   tools/packaging/flatpak_wheels.py --wheel-dir /var/tmp/wheels --output packaging/flatpak/python3-requirements.json
#
# For a local build against a staged release, swap the archive 'url' + 'sha256'
# for 'path: /path/to/unicorn-viz-<version>.tar.gz'.
app-id: io.unicornviz.UnicornViz
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: unicorn-viz
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio capture: PipeWire-Pulse socket plus native PipeWire access.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # MIDI controllers need the ALSA sequencer (/dev/snd). Tighten if a narrower
  # portal-based path becomes available.
  - --device=all
  # User media for the image/video/texture drop-ins; own config dir.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-config/unicorn-viz:create
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
modules:
  # PortAudio: the Linux sounddevice wheel is pure Python and dlopens
  # libportaudio; the freedesktop runtime does not ship it. ALSA-only build
  # (no JACK) — audio reaches PipeWire through its ALSA/Pulse compatibility.
  - name: portaudio
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-jack
      - --without-oss
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0
  - python3-requirements.json
  - name: unicorn-viz
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/unicorn-viz
      - cp -a unicornviz assets /app/share/unicorn-viz/
      - if [ -f config.dist.toml ]; then install -Dm644 config.dist.toml /app/share/unicorn-viz/config.toml; fi
      - install -Dm755 unicorn-viz /app/bin/unicorn-viz
      - install -Dm644 io.unicornviz.UnicornViz.desktop /app/share/applications/io.unicornviz.UnicornViz.desktop
      - install -Dm644 io.unicornviz.UnicornViz.metainfo.xml /app/share/metainfo/io.unicornviz.UnicornViz.metainfo.xml
      - for s in 512 256 128 64 48 32; do install -Dm644 "icons/$s/io.unicornviz.UnicornViz.png" "/app/share/icons/hicolor/${s}x${s}/apps/io.unicornviz.UnicornViz.png"; done
      - install -Dm644 LICENSE /app/share/licenses/io.unicornviz.UnicornViz/LICENSE
      - if [ -f THIRD_PARTY_LICENSES.md ]; then install -Dm644 THIRD_PARTY_LICENSES.md /app/share/licenses/io.unicornviz.UnicornViz/THIRD_PARTY_LICENSES.md; fi
    sources:
      - type: archive
        url: https://get.unicornviz.io/1.0.0-beta.111/unicorn-viz-1.0.0-beta.111.tar.gz
        sha256: f7fe2251502a073d54292692a7a2a0d5b552d4143fff5db48bec34c28421bffa
      - type: dir
        path: data
