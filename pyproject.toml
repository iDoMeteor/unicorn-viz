[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn-viz"
# Version is single-sourced from unicornviz.__version__ (see
# [tool.setuptools.dynamic]) so packaged installs can never drift from the
# runtime version again.
dynamic = ["version"]
description = "Modern demoscene visualizer — Razor 1911 vibes, Wayland-native"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.28",
    "numpy>=1.26",
    "scipy>=1.12",
    "sounddevice>=0.4.6",
    "python-rtmidi>=1.5",
    "Pillow>=10.0",
    "psutil>=5.9",
    "opencv-python-headless>=4.9",
    "soundfile>=0.12",
    "python-osc>=1.8",
]

[project.optional-dependencies]
dev = [
    # Git hook tooling used by .pre-commit-config.yaml
    "pre-commit>=3.7",
    # Local hook test runner
    "pytest>=8.0",
    # Dev security tooling (CI gates — not needed at runtime)
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Linter (CI gate)
    "ruff>=0.4",
]

[project.scripts]
unicorn-viz = "unicornviz.__main__:main"
unicorn-mix = "unicornviz.__main__:main_mixer"

[tool.setuptools.dynamic]
version = {attr = "unicornviz.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["unicornviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "local_tracks: opt-in replay tests over local audio fixtures (set UNICORNVIZ_TRACK_FIXTURES)",
]

[tool.bandit]
# Report Medium and High severity only (skips low-noise assertions / subprocess
# boilerplate in test helpers and GLSL tooling).
# B101 assert, B404/B603/B607 subprocess — routine in this codebase.
skips = ["B101", "B404", "B603", "B607"]
# Severity threshold: -ll → medium and above only

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Gate: undefined names (F8xx), unused-imports (F401), unused-vars (F841),
# multi-statement lines (E7xx).  E501 line-length excluded — long GLSL strings
# are intentional.  E702/E701 excluded globally — compact semicolon style is
# used intentionally in the ANSI parser and shader-helper sections.
select = ["F", "E7"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Legacy unused imports in files not touched by the 2026-06-18 session.
# These are documented tech debt; fix them incrementally as those files are
# edited.  Do NOT add new unused imports — this list is a ceiling, not a floor.
"unicornviz/__main__.py" = ["F401"]
"unicornviz/ansi/font.py" = ["F401"]
"unicornviz/ansi/renderer.py" = ["F401"]
"unicornviz/app.py" = ["F401", "F841"]
"unicornviz/dropins.py" = ["F401"]
"unicornviz/effects/ansi_viewer.py" = ["F401"]
"unicornviz/effects/audio_spectrogram.py" = ["F401"]
"unicornviz/effects/audio_waveforms.py" = ["F401"]
"unicornviz/effects/copper_bars.py" = ["F401"]
"unicornviz/effects/plasma.py" = ["F401"]
"unicornviz/effects/vector.py" = ["F841"]
"unicornviz/hotkeys.py" = ["F401"]
"unicornviz/overlays.py" = ["F841"]
"unicornviz/splash.py" = ["F841"]
# Test files: unused imports are sometimes needed for fixture side-effects.
"tests/*.py" = ["F401"]


[tool.pyright]
# Read by Pylance too.  Keeps the language server off the trees that hold
# no project source: the flatpak builder cache (4.7k vendored .py files),
# the beat-tracker bench's vendored trackers under tools/ (15k), the
# setuptools build dir, and the session data under assets/ + runtime/
# (100+ GB).  Without this Pylance indexes ~20k files and complains.
exclude = [
    "**/.venv",
    "**/.venv-runtime",
    "**/__pycache__",
    "**/node_modules",
    "build",
    "packaging/flatpak/.flatpak-builder",
    "packaging/flatpak/build-dir",
    "packaging/flatpak/repo",
    "tools/beat-tracker-bench",
    "assets",
    "logs",
    "runtime",
    "recordings",
]
venvPath = "."
venv = ".venv"
