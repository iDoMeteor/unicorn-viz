repos:
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check
        entry: .venv/bin/python tools/check_docs.py --warn-only
        language: system
        files: ^(docs/|drop-ins/.*/docs/|REFERENCE\.md).*\.md$
        pass_filenames: true
      # Commit-time: only the tests covering the files being committed.
      #
      # pre-commit stashes unstaged changes so hooks see just the commit, but
      # `git stash` reverts regular files and NOT submodule working-tree
      # contents. In a tree several sessions share, that pairs HEAD's copy of
      # a test with a newer drop-in -- a combination that exists nowhere -- and
      # tests coupled to in-flight drop-in code fail for reasons unrelated to
      # the commit. Scoping by changed path makes that hybrid almost never
      # matter; the full suite still gates every push below.
      - id: pytest-scoped
        name: pytest (scoped to changed files)
        entry: .venv/bin/python tools/pytest_for_changes.py
        language: system
        files: \.(py|toml|txt|yaml)$
        pass_filenames: true
        # Commit stage only -- at push time pytest-full covers everything, and
        # running the scoped pass again there is pure duplicate work.
        stages: [pre-commit]
      - id: glsl-validate
        name: glsl-validate
        entry: .venv/bin/python tools/validate_glsl.py
        language: system
        files: ^(unicornviz/|drop-ins/).+\.py$
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check unicornviz/ tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: bandit
        entry: .venv/bin/bandit -r unicornviz/ drop-ins/ -ll -q
        language: system
        pass_filenames: false
        always_run: true
      - id: version-report
        name: version-report
        entry: bash -c '.venv/bin/python tools/version_report.py --plain > current-versions.txt && git add current-versions.txt'
        language: system
        pass_filenames: false
        always_run: true
      # Push-time: the whole suite, so nothing reaches origin untested.
      - id: pytest-full
        name: pytest (full suite, pre-push)
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        entry: .venv/bin/pip-audit -r requirements.txt
        language: system
        pass_filenames: false
        stages: [manual]
