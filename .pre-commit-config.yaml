repos:
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check
        entry: .venv/bin/python tools/check_docs.py --warn-only
        language: system
        files: ^(docs/|drop-ins/.*/docs/|REFERENCE\.md).*\.md$
        pass_filenames: true
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
