# ---------------------------------------------------------------------------
# ProjectM preset host drop-in  (drop-ins/projectm-01)
# Requires an installed libprojectM runtime and a preset pack containing
# .milk / .prjm files. This Phase 1 drop-in scans preset directories, renders
# via the current Unicorn Viz GL context, and supports Ctrl+N/P/R preset
# switching while the effect is active.
# ---------------------------------------------------------------------------
[effects.ProjectMEffect]
speed = 1.0
preset_duration = 20.0
smooth_transition = true
lock_preset = false
start_clean = false
beat_sensitivity = 1.0
fps_hint = 60
projectm_library = ""
preset_dirs = "drop-ins/projectm-01/presets"
texture_dirs = ["drop-ins/projectm-01/presets/presets-milkdrop-texture-pack/textures", "drop-ins/projectm-01/textures"]
start_preset = ""
# Solid-color auto-exclusion: a preset that reads as continuously one
# flat color (any color, not just black) for solid_color_duration
# seconds gets excluded permanently (excluded_presets.txt). No warm-up
# grace period -- a preset that opens flat and takes its time waking up
# is caught just like one that stays flat forever.
solid_color_skip_enabled = true
solid_color_duration = 0.2       # seconds continuously flat before exclusion
# solid_color_std_threshold = 4.0  # 0-255 scale; below this counts as "flat"
preset_warmup_frames = 8
# projectM affinity & preset behavior (inside [auto_vj] section)
#
# projectm_affinity       — Per-swap probability (0..1) that the director
#                           biases toward ProjectM Presets when available.
#                           0 = disabled. Profile defaults: chill=0.15,
#                           normie=0.25, raver=0.30.
# projectm_dwell_mult     — Dwell-time multiplier applied when projectM wins
#                           an affinity pick (profile defaults ~2.0–2.5).
# projectm_preset_min_interval_s — Minimum seconds between Auto VJ–driven
#                           preset changes inside projectM (dance behavior).
# projectm_preset_on_event_chance — Probability (0..1) of triggering a
#                           random preset on musical events (drop/impact/
#                           build/climax) while projectM is active.
#
# projectm_preset_pingpong_enabled — Raver-only: allow preset-level ping-pong
#                           inside projectM (bouncing between two presets).
# projectm_preset_pingpong_beats   — Beats between preset swaps.
# projectm_preset_pingpong_min_swaps / max_swaps — Budget range.
#
# Post-FX ping-pong (raver only, layered on top of effect/preset ping-pong):
# postfx_pingpong_enabled         — Enable the parallel postfx oscillator.
# postfx_pingpong_beats           — Beats between post-FX slot swaps.
# postfx_pingpong_min_swaps / max_swaps — Budget range per run.
# postfx_pingpong_trigger_chance  — Probability of starting a run on beat.
#
# Example (add inside your [auto_vj] block):
#   [auto_vj]
#   projectm_affinity = 0.30
#   projectm_dwell_mult = 2.0
#   projectm_preset_min_interval_s = 6.0
#   projectm_preset_on_event_chance = 0.75
#   projectm_preset_pingpong_enabled = true
#   projectm_preset_pingpong_beats = 4
#   postfx_pingpong_enabled = true
#   postfx_pingpong_trigger_chance = 0.40
# ---------------------------------------------------------------------------

# ── dj-mixer-01 — two-deck DJ mixer window + Pioneer DDJ-REV1 ────────────────
# Loaded but idle: the window, the audio output stream, and the REV1 MIDI port
# are all left alone until you open the mixer with Shift+D (Esc closes it;
# left-click a deck to play/pause). Opening the window is when the REV1 is
# claimed (as a raw-onlyjaux device that coexists with a VJ-side controller);
# closing releases it. See drop-ins/dj-mixer-01/docs/ (feature-overview.md,
# hardware-bringup.md, configuration.md).
[dj_mixer]
enabled = true               # load the drop-in (idle until Shift+D)
start_enabled = false   # open the mixer (window + REV1 + audio) at boot
rev1_device = "rev1"         # MIDI port-name substring for the DDJ-REV1
music_dir = "~/Music/crates" # crate folder browsed by the REV1 rotary + LOAD
display_index = 4            # display the mixer window opens on
fullscreen = true           # borderless full-display window when true
#blocksize=2048
prebuffer_blocks = 24   # PortAudio output buffer depth (blocks of `blocksize`); ~10.7 ms each at 48k/512.
                        # Sets control-to-ear latency + glitch immunity (blocking-write mode). 6 ≈ 64 ms.
#ui_scale = 0.5         # mixer-window raster scale (0.25-1.0, default 1.0); 0.5 quarters
                        # PIL raster + texture-upload cost, GPU upscales to the window.
# auto_stem_on_load: extract stems for a track the moment it lands on a deck,
# instead of waiting for a library batch.  It goes to the FRONT of the queue,
# so the tune you are about to play beats a run that might be hours long.
# Default false -- it starts a heavy background job on every load, which is a
# choice worth making deliberately.  Never interrupts a separation already
# running.  Toggleable live in the STEMS settings tab.
# auto_stem_on_load = false
# dial_reset_on_load: recentre a deck's EQ / TRIM / FILTER when a new track
# loads, so a fresh tune starts flat instead of inheriting the last one's tone.
# Off keeps them where they are, which is what you want when you ride the
# physical knobs -- the screen then agrees with your hands.  The per-deck LOCK
# chip overrides this either way, and TEMPO / KEY always reset regardless.
# Toggleable live in the GENERAL settings tab.  Default true.
# dial_reset_on_load = true
# pad_face_cache: render each distinct pad face once and paste it, instead of
# drawing all 32 pads x 4 decks every frame.  Measured ~25-49% off a mixer
# frame depending on scene.  OFF by default because it is not purely a
# performance change: the raster path overwrites rather than blends, so drawn
# directly the pads' glow and top-light land as literal translucent values,
# while a cached tile composites them -- lit pads come out calmer, and the
# frame stops going semi-transparent where a highlight sits.  Turn it on if
# you prefer that look and want the frame time back.
# pad_face_cache = true
# tooltips: hover tooltips across the whole mixer.  A learning aid; once you
# know the surface they are in the way.  Toggleable live in the GENERAL
# settings tab (which remembers your choice and wins over this seed), and off
# also skips *building* the hover regions rather than building and discarding
# them.  Default true.
# tooltips = true
# sections: the labelled song-structure strip under the FULL waveform --
# intro / build / drop / breakdown / outro, or verse / chorus / bridge on
# song-form material, detected during analysis and coloured by role.  A
# block's brightness follows how sure the detector is, and the biggest drop
# is drawn brightest.  Tracks analyzed before this existed carry no strip
# until re-analyzed.  Toggleable live in the GENERAL settings tab (which
# remembers your choice and wins over this seed).  Default true.
# sections = true
# session_minutes: how long the set is meant to run, for the title-bar
# countdown and the VJ hand-off.  The clock starts on the FIRST AUDIO, not
# when the mixer window opens, so setting up and sound-checking do not count
# against it.  Published to the VJ director so the visuals can build toward
# the end of the night on their own.  Separately, and regardless of this
# setting, the director is told the moment the LAST TRACK of a list starts --
# the exact grand-finale cue, with that song's length and where its biggest
# drop lands; that one needs loop (the auto-play infinity button) OFF, since
# a looping list has no last track.  0 = no set clock.  Changeable live in
# SETTINGS -> GENERAL -> SET LENGTH.  Default 0.
# session_minutes = 120
# skip_silence: start a track at its first note and treat its last note as
# the end, instead of sitting through the dead air many rips carry.  Bounds
# only -- the audio is untouched and you can still scrub into the silence.
# Toggleable live in the mixer's AUTOMATION settings tab.  Default true.
# skip_silence = true
# recording_format: master-mix capture format, settable live in the
# RECORDING settings tab.  One of wav16 / wav24 / wav32f / aiff24 / flac24
# (lossless) / mp3 / ogg.  Default wav16.
# recording_format = "wav16"
# recordings_dir: where mix recordings are written (empty = runtime/recordings/).
# recordings_dir = ""
# -- Stems (Serato-style per-deck VOCALS/MELODY/BASS/DRUMS toggles) ----------
# Stems are extracted OFFLINE with Demucs (unicorn-horn's model path), cached
# under runtime/stems/ keyed by the track's audio hash, and auto-attach on
# deck load.  The header STEMS+ button extracts the loaded track; toggles
# appear once stems exist.  Requires demucs (pip install demucs, or an
# installed unicorn-horn with optional requirements — its venv is reused).
#stems_model = "htdemucs"   # htdemucs | htdemucs_ft | hdemucs_mmi | mdx_q | mdx_extra_q
#stems_python = ""          # interpreter that can import demucs (auto-detected when empty)
#stems_dir = ""             # stem cache folder (default: runtime/stems)
#auto_gain = true            # loudness-match decks on load (RMS of the loud body)
output_device = ""   # master → the REV1 (a 4-output USB
                             # interface); connect your speakers to the REV1's
                             # master output.  Leave unset for the system default.
headphone_device = "DDJ-REV1: USB Audio"    # cue on the REV1's outputs 3-4 (the phones jack);
                             # 'same' shares the 4-channel master device (1-2
                             # master, 3-4 cue).  Set a separate device name for
                             # a different output, or "" to disable.  Stereo-only
                             # master devices fall back to master-only.
#midi_map = ""               # TOML mapping file for a non-REV1 controller
                             # (see drop-ins/dj-mixer-01/mappings/example-generic.toml)
# -- Scratch transition (auto-mix flourish) ---------------------------------
# On an auto-crossfade into a track that is NOT harmonically compatible, one
# wheel step away, or within `spin_bpm_tol` BPM, the outgoing deck does a
# turntable spin to paper over the discontinuity: a backspin (reverse) when the
# incoming track is slower, a spin-up (over-speed) when it is faster.
#spin_transitions = true     # master on/off for the effect
#spin_back = -5.0            # backspin strength (slower incoming; below -1 the
                             # audio actually runs backward)
#spin_fwd = 4.5             # spin-up strength (faster incoming)
#spin_bpm_tol = 8.0          # incoming within N BPM counts as smooth (no spin)
#spin_decay = 0.89           # coast-back rate per audio block (higher = longer)
#spin_throw_s = 0.6          # a spin is a SLAM: the crossfade becomes a fast
                             # fader throw this long (~the spin's coast) instead
                             # of the full crossfade_s blend, and the transition
                             # fires late so the outgoing track isn't cut short

# ---------------------------------------------------------------------------
# Video output interop  (drop-ins/video-out-01)
# ---------------------------------------------------------------------------
# Publishes the rendered show to other applications so nothing has to
# screen-capture a window.  The v4l2loopback backend appears in OBS as an
# ordinary "Video Capture Device" with no plugin required.
#
# Setup (once):
#   sudo dnf install v4l2loopback          # Fedora
#   drop-ins/video-out-01/v4l2loopback_setup.sh
#
# enabled: loads the drop-in (default true, like any other drop-in).
# start_enabled: whether it's actually publishing at boot vs loaded-but-
# idle until Alt+Shift+O. Left false by default -- this one opens a device
# and runs a writer thread, so unlike a plain effect toggle, "loaded" and
# "actively running" are deliberately kept separate here.
[video_out]
enabled = true
start_enabled = false

[video_out.v4l2]
enabled = true
device = "/dev/video10"   # empty => first existing /dev/video1x node
fps_cap = 30              # 0 = every rendered frame

# Zero-copy PipeWire/DMA-BUF (Wayland only; needs libfunnel built from
# source -- https://github.com/hoshinolina/libfunnel).  Costs no readback
# at all, so it does not subscribe to the frame tap.  Consume in OBS with
# the obs-pwvideo plugin.  UNVERIFIED on real hardware as of 0.2.0.  Left
# off by default until a frame has actually been confirmed in OBS -- v4l2
# above is the dependable, no-plugin path.
#
# [video_out.pipewire]
# enabled = true
# name = "Unicorn Viz"

# ---------------------------------------------------------------------------
# Per-frame performance instrumentation
# ---------------------------------------------------------------------------
# Logs a per-stage breakdown (events/audio/effects/draw/swap/subsys_*) for
# slow frames plus a periodic sample.  Off by default; --log-level DEBUG also
# turns it on.  Analyse with:  grep "Perf frame" logs/<newest>.log
#
# [logging]
# perf_frames = true
