[window]
fullscreen = true

[demo]
mode = "random"
effect_duration = 120
transition = "shuffle"

[audio]
reactivity = 1.1
latency = "high"
try_alsa_loopback = false

[ansi]
ansi_dir_auto = "assets/ansi/acid"
ansi_own_dir = "assets/ansi"
ansi_acid_dir = "assets/ansi/acid"

[playlist]
start_effect = "Audio Spectrum"

[logging]
level = "INFO"

[recording]
auto_record = false
directory = "recordings"
capture_audio = true

[render]
internal_scale = 1

[overlays]
flash_messages = false

# ---------------------------------------------------------------------------
# Webcam auto-cycle  — how long to show each webcam effect before random-
# picking the next one when KP Enter is active.
# Default (0) falls back to demo.effect_duration.
# ---------------------------------------------------------------------------
# [webcam]
# cycle_interval = 30    # seconds; 0 = use demo.effect_duration

# ---------------------------------------------------------------------------
# WebcamOverlay effect  (drop-ins/webcam-01)
# Live camera feed with animated background. Selected like any other effect.
# Requires: opencv-python-headless (already in requirements.txt)
# ---------------------------------------------------------------------------
# [effects.WebcamOverlay]
# camera_device  = 0             # /dev/video index (Linux) or DirectShow (Windows)
# camera_width   = 1280
# camera_height  = 720
# camera_fps     = 30
# pip_position   = "bottom_right"    # top_left | top_center | top_right |
#                                     # left | center | right |
#                                     # bottom_left | bottom_center | bottom_right |
#                                     # fullscreen
# pip_scale      = 0.33          # fraction of viewport width  (0.12 – 0.80)
# enabled        = true          # false disables camera worker
