[logging]
level = "info"

[window]
display_mode  = "mirror"   # single | span_all | mirror_all
display_index  = 2
exclude_display_indices = [3,4]   # raw SDL display indices ignored only by span_all / mirror_all

[ansi]
ansi_dir_auto = "assets/ansi/acid"

[effects.AudioSpectrum]
scale_when_framed = true
# candy_frame_disallow = true

[effects.AudioSine]
chaos_snap = 0.2

[midi]
device = "apc mini mk2 notes"  # port name substring; empty = MIDI disabled
preset = "akai_apc_mini_mk2"   # built-in preset: akai_apc_mini_mk2 | akai_mpk_mini | novation_launchcontrol | generic | ""

[recording]
directory = "recordings"
# Audio source for recordings. Left unset, Unicorn Viz follows whatever the
# visualizer is analyzing, then any output that is actually playing, then the
# system default. Pin it here (or on the config editor's Recording tab) when
# several apps play at once and auto-detection picks the wrong one.
# List candidates with:  pactl list short sinks   -> use "<name>.monitor"
# audio_input_device = "alsa_output.usb-AlphaTheta_Corporation_DDJ-REV1_------00.analog-surround-40.monitor"
#
# Constant frame rate the file is muxed at; frames are paced to it on
# wallclock, and the app caps its GPU readback here too. Lower = cheaper.
fps = 30
# capture_audio = true
# crf = 18          # H.264 quality, lower is better (0-51)
# preset = "veryfast"

[render]
# fps_limit = 30   # 0 = follow display vsync; 24 | 30 | 60

[overlays]
flash_messages = false
hud_auto_hide = false
#hud_timeout_s = 60.0

[hotkeys]
# F6 randomizes effect speed within this range (when effect exposes `speed`)
random_speed_min = 0.25
random_speed_max = 2.50
# F7 randomizes audio reactivity within this range
random_reactivity_min = 0.40
random_reactivity_max = 2.00
# Alt+[/] adjusts zoom; Shift+Z randomizes within this range
random_zoom_min = 0.30
random_zoom_max = 1.80

[streaming]
enabled = false
endpoint = "rtmp://live-api-s.rumble.com/live"
# rumble_endpoint = "rtmp://live-api-s.rumble.com/live"
# youtube_endpoint = "rtmp://a.rtmp.youtube.com/live2"
# custom_endpoint = "rtmp://your.rtmp.server/live"
# stream_url = ""              # full override URL; if set, endpoint/key are ignored
# ffmpeg_path = "ffmpeg"
# fps = 60
# video_codec = "libx264"
# preset = "veryfast"
# pixel_format = "yuv420p"
# include_audio = true
# audio_input_format = "pulse"
# audio_input_device = ""      # empty => default sink monitor (Pulse/PipeWire)
# audio_codec = "aac"
# audio_bitrate = "160k"

[spotify]
enabled = true
poll_interval_s = 1

[spotify.web_api]
enabled = true
client_id = "9c8acb4afb744638917beab3b89ab369"
scopes = [
	"user-read-playback-state",
	"user-read-currently-playing",
	"playlist-read-private",
	"playlist-read-collaborative",
]
poll_interval_s = 3.0        # used when playerctl unavailable (Windows); fallback otherwise
http_timeout_s = 1.0


[media]
enabled = true
media_dir = "~/Music"                # local music root (Media Deck: Shift+L)

# ---------------------------------------------------------------------------
# Live chat overlay (drop-ins/chat-01)
# Powered by Ably Realtime.  Get a free API key at https://app.ably.io
# Also see drop-ins/chat-01/web/ChatWidget.tsx for the React component.
#
# Hotkeys:
#   C             — Toggle overlay on / off
#   Ctrl+C        — Cycle position forward (bottom→left→top→right→…)
#   KP 1-9 / .   — Set position (compass layout) / hide
# ---------------------------------------------------------------------------
[chat]
enabled = false
username = "VJ"              # display name shown in chat for messages you send
position = "bottom"          # top | bottom | left | right
# scroll_speed = 60.0          # pixels/second for top/bottom ticker
# message_lifetime_s = 60.0   # seconds a message stays visible in dock mode

[candy_frame]
enabled = true

[lyrics]
enabled = true

[color_grade]
start_enabled = false       # passive grade on at boot; Ctrl+Shift+Alt+L toggles

[video_postfx]
enabled = true
# video_dir = ""             # override; default this drop-in's own videos/ folder
# max_layers = 4             # simultaneous chroma-keyed video layers (1-16)
# key_tolerance = 0.14       # RGB distance below which a pixel is keyed out (0-1)
# key_softness = 0.06        # smoothstep edge width added to key_tolerance
# key_color = ""             # optional "R,G,B" override; empty = auto-detect per clip

[auto_vj]
enabled = true
beat_tracker_engine = "v3"   # genre never writes back to an established tempo (see docs/adr/vj-system.md)
beat_tracker_shadow_engine = "v2"   # re-enabled 2026-08-14: mid-investigation on a real v3/v2 regression (see docs/adr/vj-system.md); turn off again once phase_tol/blend settle
beat_tracker_shadow2_engine = "legacy"   # 2026-08-14, round three: v1 running alongside the v2 shadow above for a three-way v1/v2/v3 comparison (see docs/adr/vj-system.md); <0.3ms/frame, cheap to leave on for a few sessions
acf_peak_interpolation_enabled = true   # A/B test flag (docs/adr/vj-system.md round three) -- B run starts now (A was the 20260813T202616 session)
# -- round-three close-out options (2026-08-17, detector rc.33 / auto-vj rc.90) --
# All default ON (or to the values shown) in code; uncomment to override.
bpm_lock_dwell_bars = 16.0            # minimum lock dwell window (bars); in-band drift beyond the pct below is routed through the large-jump gates; 0 disables; owner test candidates: 8 and 16 -- 16-bar variant active 2026-08-17, watch dwell_gated_count/refractory_guard_engaged_count/genre_evidence_applied_count/tap_prime_accept_count/persistence_reset_count/phase_error_median/phase_error_iqr in the corpus rows
# bpm_lock_dwell_drift_pct = 0.04      # cumulative in-band drift budget from the lock anchor during the dwell window
# refractory_guard_enabled = true      # suspend the BPM-fed analyzer refractory while candidate evidence disagrees with the lock (anti self-confirmation)
# mood_prime_enabled = true            # manual audio-profile change primes the detector from the best in-band ACF candidate ("cheater mode" #1)
# mood_prime_confidence = 0.7          # confidence used for the mood-prime (below the mixer bus's 0.9 -- a genre label is weaker evidence than a per-track analysis)
# genre_candidate_scoring_enabled = true   # tempo-independent genre evidence reweights ACF candidates while acf_confidence is low ("consult only when unsure")
# genre_candidate_gate_confidence = 0.5    # consult genre evidence only when the previous cycle's acf_confidence is below this
# persistence_spread_pct = 0.035       # relative component of the large-jump persistence spread limit: max(6.0, pct * window median)
# candidate_spread_pct = 0.03          # relative component of the short candidate-window spread limit: max(4.0, pct * median)
# cold_start_guard_cycles = 25         # ACF cycles after cold start during which downbeat_regularity is excluded from the confidence blend
# -- drop trigger/sustain split (2026-08-18, detector rc.35 / director rc.11 / auto-vj rc.97) --
# Default ON: drop entry + fizzle read the new impact_novelty/drop_sustain
# signals (docs/adr/vj-system.md "Drop Trigger/Sustain Split"). Uncomment to
# restore the legacy composite-drop_score path one-line:
# drop_signal_engine = "legacy"
# Per-mood thresholds live in _PROFILE_PRESETS (weights-and-thresholds.md has
# the table); override any of them here like other profile keys:
# drop_trigger_threshold = 0.60        # trigger entry bar (~p99 of real-audio readings)
# drop_trigger_fastlane = 0.75         # strong-trigger shorter-hold bar (default threshold x1.25)
# drop_sustain_entry = 0.58            # established-sustain entry bar (covers joining mid-drop)
# drop_sustain_fizzle_floor = 0.35     # absolute fizzle floor under the peak-relative (x0.9) check
postfx_cruise_slots = [1,2,3,4,5,6]
log_decisions = true
live_training_enabled = true
sequence_training_enabled = true
live_training_corpus_path = "assets/training/corpus/live-corpus.jsonl"
sequence_training_corpus_path = "assets/training/corpus/sequence-corpus.jsonl"
# auto_exit_after_finale = false
# Smooths only the HUD "BPM: nnn" readout (code default: on); every other
# consumer (gates, director timing, recommender scoring, training-corpus
# logging) always reads the fast raw value. Off here for now -- soaking
# with the raw, unsmoothed number visible while validating this week's
# detector changes. See docs/adr/vj-system.md.
published_bpm_smoothing_enabled = false
published_bpm_smoothing_s = 4.0

[control_room]
enabled = false
fullscreen = true       # borderless fullscreen on the chosen display (default true)
display_index = 3
render_interval = 0.5
output_device = "DDJ-REV1, Windows WASAPI"

[keystrokes]
enabled = true

[webcam]
pip_position   = "hidden"  # top_left | top_center | top_right |
pip_scale      = 0.2            # fraction of viewport width (0.12 – 0.80)
border_thickness = 3.0           # border/backplate thickness in pixels
# border_color   = [0.04, 0.72, 1.0, 0.28]  # RGBA 0.0 – 1.0
# treatment      = "neon"          # raw | neon | glitch | vintage | thermal
# cycle_interval now only sets the auto-cycle baseline: effects show for
# half this value, the plain camera in between shows for the full value
