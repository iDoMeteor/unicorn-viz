[window]
fullscreen = true

[demo]
mode = "random"
effect_duration = 120
transition = "shuffle"

[audio]
reactivity = 1.1
latency = "high"
try_alsa_loopback = false

[ansi]
ansi_dir_auto = "assets/ansi/acid"
ansi_own_dir = "assets/ansi"
ansi_acid_dir = "assets/ansi/acid"

[playlist]
start_effect = "Audio Spectrum"

[logging]
level = "INFO"

[recording]
auto_record = false
directory = "recordings"
capture_audio = true

[render]
internal_scale = 1

[overlays]
flash_messages = false

# ---------------------------------------------------------------------------
# System camera overlay  —  always-on PiP above all effects, below the HUD.
# Requires opencv-python-headless: pip install opencv-python-headless
# ---------------------------------------------------------------------------
# [webcam]
# enabled        = true          # false disables camera entirely
# device         = 0             # /dev/video index (Linux) or DirectShow (Windows)
# width          = 1280
# height         = 720
# fps            = 30
# pip_position   = "bottom_right"    # top_left | top_center | top_right |
#                                     # left | center | right |
#                                     # bottom_left | bottom_center | bottom_right |
#                                     # fullscreen
# pip_scale      = 0.33          # fraction of viewport width  (0.12 – 0.80)
# log_frames     = false         # emit DEBUG log every 60 captured frames
# cycle_interval = 0             # webcam effect auto-cycle interval in s (0 = effect_duration)

# ---------------------------------------------------------------------------
# WebcamOverlay effect  (drop-ins/webcam-01) — standalone effect w/ animated
# background and camera PiP; selected via playlist like any other effect.
# ---------------------------------------------------------------------------
# [effects.WebcamOverlay]
# camera_device  = 0
# camera_width   = 1280
# camera_height  = 720
# camera_fps     = 30
# pip_position   = "bottom_right"
# pip_scale      = 0.33
# enabled        = true
