[window]
fullscreen = true

[demo]
mode = "random"
effect_duration = 120
transition = "shuffle"

[audio]
reactivity = 1.1
latency = "high"
try_alsa_loopback = false

[ansi]
ansi_dir_auto = "assets/ansi/acid"
ansi_own_dir = "assets/ansi"
ansi_acid_dir = "assets/ansi/acid"

[playlist]
start_effect = "Audio Spectrum"

[logging]
level = "INFO"

[recording]
auto_record = false
directory = "recordings"
capture_audio = true

[render]
internal_scale = 1

[overlays]
flash_messages = false

# ---------------------------------------------------------------------------
# Webcam system overlay  (drop-ins/webcam-01)
# Always-on camera PiP above every effect. Requires opencv-python-headless.
# ---------------------------------------------------------------------------
# [webcam]
# enabled        = true            # false disables camera entirely
# device         = 0               # /dev/video index (Linux) or DirectShow (Windows)
# width          = 1280
# height         = 720
# fps            = 30
# pip_position   = "bottom_right"  # top_left | top_center | top_right |
#                                   # left | center | right |
#                                   # bottom_left | bottom_center | bottom_right |
#                                   # fullscreen
# pip_scale      = 0.33            # fraction of viewport width (0.12 – 0.80)
# treatment      = "neon"          # raw | neon | glitch | vintage | thermal
# cycle_interval = 0               # auto-cycle interval in s (0 = 30 s default)

# ---------------------------------------------------------------------------
# Psychedelic effect  (unicornviz/effects/psychedelic.py)
# Neon palette-sine field — split from the old webcam background shader.
# ---------------------------------------------------------------------------
# [effects.Psychedelic]
# speed = 1.0

# ---------------------------------------------------------------------------
# Image Showcase drop-in  (drop-ins/images-01)
# By default, loads bundled images from drop-ins/images-01/images/.
# Set image_dir to use a different folder instead; it is an override, not an
# additional search path.
# ---------------------------------------------------------------------------
# [effects.ImageShowcase]
# image_dir = ""               # override path; empty = bundled images folder
# speed = 1.0
# mix_time = 8.0               # seconds per image
