[window]
fullscreen = true
show_cursor = false
display_mode  = "single"   # single | span_all | mirror_all
#display_index  = 0
#exclude_display_indices = [0]   # raw SDL display indices ignored only by span_all / mirror_all

[demo]
auto_advance = false
mode = "sequential"
effect_duration = 30
transition = "shuffle"

[audio]
reactivity = 1.3
latency = "low"
try_alsa_loopback = false
profile = "house"

[ansi]
ansi_dir_auto = "assets/ansi/acid"
ansi_own_dir = "assets/ansi"
ansi_acid_dir = "assets/ansi/acid"

[playlist]
start_effect = "Audio Spectrum"

[logging]
level = "error"

[dropins]
exclude = "none"

[recording]
auto_record = false
directory = "recordings"
capture_audio = true

[render]
internal_scale = 1

[overlays]
flash_messages = false
hud_auto_hide = false
#hud_timeout_s = 60.0

[hotkeys]
# F6 randomizes effect speed within this range (when effect exposes `speed`)
random_speed_min = 0.25
random_speed_max = 2.50
# F7 randomizes audio reactivity within this range
random_reactivity_min = 0.40
random_reactivity_max = 2.00
# Alt+[/] adjusts zoom; Shift+Z randomizes within this range
zoom_min = 0.1
zoom_max = 3.0
random_zoom_min = 0.30
random_zoom_max = 1.80

# ---------------------------------------------------------------------------
# RTMP streaming subsystem  (drop-ins/streaming-01)
# Streams the final single composed frame (not tiled multi-head mirror output)
# plus live audio to an RTMP endpoint using ffmpeg.
# ---------------------------------------------------------------------------
[streaming]
enabled = false
auto_start = false
provider = "rumble"
endpoint = "rtmp://live-api-s.rumble.com/live"
stream_key = ""
# rumble_endpoint = "rtmp://live-api-s.rumble.com/live"
# youtube_endpoint = "rtmp://a.rtmp.youtube.com/live2"
# custom_endpoint = "rtmp://your.rtmp.server/live"
# stream_url = ""              # full override URL; if set, endpoint/key are ignored
# ffmpeg_path = "ffmpeg"
# fps = 60
# video_codec = "libx264"
# preset = "veryfast"
# pixel_format = "yuv420p"
# include_audio = true
# audio_input_format = "pulse"
# audio_input_device = ""      # empty => default sink monitor (Pulse/PipeWire)
# audio_codec = "aac"
# audio_bitrate = "160k"

# ---------------------------------------------------------------------------
# Auto VJ  (drop-ins/auto-vj-01)
# Intelligent automation layer that drives the system like a human VJ:
# beat-aware effect swaps, drop hits, post-fx modulation, ping-pong, etc.
# Currently a SCAFFOLD ONLY — see drop-ins/auto-vj-01/PLAN.md.
# Keep this disabled until the controller is feature-complete and tested.
# ---------------------------------------------------------------------------
[auto_vj]
enabled = true
profile = "raver"          # chill | normie | raver | user (unset => normie preset)
auto_profile_enabled = true  # true = switch chill/normie/raver by BPM
auto_profile_chill_max_bpm = 110.0
auto_profile_raver_min_bpm = 136.0
auto_profile_min_confidence = 0.45
auto_profile_switch_cooldown_s = 20.0
# With auto_profile_enabled = false, explicit tuning keys below create manual
# USER mode layered over the selected base preset.
# show_duration_min    = 90    # optional full-set duration in minutes
# show_duration_s      = 5400  # legacy fallback in seconds (used only if *_min is unset)
# finale_auto_trigger  = true  # trigger grand finale automatically near show end
# finale_lead_s        = 45.0  # trigger window before show end (seconds)
#
# Phase 4 starter profile (conservative):
# - leave enabled=false until ready to test
# - cruise-only feel: slow swaps + gentle reactivity drift
# mode                  = "auto"       # Phase 3 treats auto as cruise behavior
# manual_grace_s        = 8.0          # ignore auto actions while user is driving
# min_effect_dwell_s    = 35.0         # conservative: slower effect changes
#max_effect_dwell_s    = 120.0
# reactivity_min        = 0.90         # gentle drift bounds
#reactivity_max        = 2.5
# reactivity_target_interval_s = 4.0
# reactivity_slew_per_s = 0.20
#cruise_effect_tags    = ["audio"]
# beat_threshold        = 0.55
# bpm_min               = 70
# bpm_max               = 180
# drop_energy_threshold = 0.78
#drop_cooldown_s       = 15.0
# allow_effect_swap     = true
# allow_postfx          = true
# allow_overlays        = true         # rainbow nova / screen burst / dancing unicorn
# allow_tweakables      = true         # reactivity / speed / zoom
# pingpong_a            = "Tron Grid"
pingpong_b            = "Crystal Pyramids"
# pingpong_beats        = 4
# pingpong_auto_enabled = true         # auto-enter ping-pong only makes sense in raver mode
# pingpong_auto_bpm_min = 138.0        # require a fast locked groove before triggering
# pingpong_auto_trigger_chance = 0.35  # chance at each eligible cruise swap point
# pingpong_auto_min_swaps = 4          # auto ping-pong exits after a random swap budget
# pingpong_auto_max_swaps = 10
 log_decisions         = true        # write JSONL decision log per session
#postfx_cruise_interval_s = 25
postfx_cruise_slots = [1,2,3,7,9]
#postfx_drop_duration_s = 5

# ---------------------------------------------------------------------------
# Control Room operator window  (drop-ins/control-room-01)
# Dedicated VJ/operator monitor with program preview, transport, FX banks,
# tweakable controls, and an effect browser.
# ---------------------------------------------------------------------------
[control_room]
enabled = false
#fullscreen = true       # borderless fullscreen on the chosen display (default true)
#display_index = 1
#width = 1920
#height = 1080
show_preview = false
preview_scale = 0.25
theme = "dark"

# ---------------------------------------------------------------------------
# Keystroke logging  (unicornviz/keystroke_log.py)
# Appends one JSON line per keypress to logs/keystrokes-<date>.log.
# Each line includes: timestamp, key label, current effect, and beat context
# (bpm, beat_phase, energy, vj_mode) when Auto VJ is running.
# Useful for training Auto VJ behaviour models; default is OFF.
# ---------------------------------------------------------------------------
[keystrokes]
enabled = true

# ---------------------------------------------------------------------------
# Webcam system overlay  (drop-ins/webcam-01)
# Always-on camera PiP above every effect. Requires opencv-python-headless.
# ---------------------------------------------------------------------------
[webcam]
# enabled        = true            # false disables camera entirely
# device         = 0               # /dev/video index (Linux) or DirectShow (Windows)
# width          = 1280
# height         = 720
# fps            = 30
pip_position   = "hidden"  # top_left | top_center | top_right |
#                                   # left | center | right |
#                                   # bottom_left | bottom_center | bottom_right |
#                                   # fullscreen | hidden
# pip_scale      = 0.33            # fraction of viewport width (0.12 – 0.80)
# border_thickness = 4.0           # border/backplate thickness in pixels
# border_color   = [0.04, 0.72, 1.0, 0.28]  # RGBA 0.0 – 1.0
# treatment      = "neon"          # raw | neon | glitch | vintage | thermal
# cycle_interval = 0               # auto-cycle interval in s (0 = 30 s default)

# ---------------------------------------------------------------------------
# Image Showcase drop-in  (drop-ins/images-01)
# By default, loads bundled images from drop-ins/images-01/images/.
# Set image_dir to use a different folder instead; it is an override, not an
# additional search path.
# ---------------------------------------------------------------------------
[effects.ImageShowcase]
# image_dir = ""               # override path; empty = bundled images folder
preload_images = true        # true = warm image cache at startup
# speed = 1.0
mix_time = 15.0              # seconds per image

# ---------------------------------------------------------------------------
# Video Showcase drop-in  (drop-ins/videos-01)
# By default, loads clips from drop-ins/videos-01/videos/.
# Set video_dir to use a different folder instead; it is an override, not an
# additional search path.
# ---------------------------------------------------------------------------
[effects.VideoShowcase]
# video_dir      = ""          # override path; empty = bundled videos folder
preload_videos = false        # true = open/prime clips at startup
# speed          = 1.0
mix_time       = 20.0        # seconds per clip

# ---------------------------------------------------------------------------
# Sim Showcase drop-in  (drop-ins/sims-01)
# Supports public USD scene packs (robotics/simulation datasets).
# Provide one folder in scene_dir or multiple comma-separated folders in
# scene_dirs. Only .usda/.usdc/.usdz files are loaded.
# ---------------------------------------------------------------------------
# [effects.SimShowcase]
# speed = 1.0
# mix_time = 14.0
# camera_energy = 1.0
# scene_dir = "drop-ins/sims-01/scenes"
# scene_dirs = "drop-ins/sims-01/scenes,assets/robotics-usd,assets/sims"

# ---------------------------------------------------------------------------
# ProjectM preset host drop-in  (drop-ins/projectm-01)
# Requires an installed libprojectM runtime and a preset pack containing
# .milk / .prjm files. This Phase 1 drop-in scans preset directories, renders
# via the current Unicorn Viz GL context, and supports Ctrl+N/P/R preset
# switching while the effect is active.
# ---------------------------------------------------------------------------
# [effects.ProjectMEffect]
# speed = 1.0
# preset_duration = 20.0
# smooth_transition = true
# lock_preset = false
# start_clean = false
# beat_sensitivity = 1.0
# fps_hint = 60
# projectm_library = ""
# preset_dir = "drop-ins/projectm-01/presets"
# preset_dirs = "drop-ins/projectm-01/presets,/opt/projectm/presets"
# texture_dirs = "assets/projectm-textures"
# start_preset = ""
