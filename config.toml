[logging]
level = "info"

[window]
fullscreen = true
show_cursor = false
display_mode  = "single"   # single | span_all | mirror_all
display_index  = 2
exclude_display_indices = [3,4]   # raw SDL display indices ignored only by span_all / mirror_all

[demo]
auto_advance = false
mode = "sequential"
effect_duration = 30
transition = "shuffle"

[audio]
reactivity = 1.0
latency = "low"
profile = "house"

[ansi]
ansi_dir_auto = "assets/ansi/acid"

[playlist]
start_effect = "Audio Spectrum"

[effects.AudioSpectrum]
scale_when_framed = true
# candy_frame_disallow = true

[effects.SineScroller]
chaos_snap = 0.2

[midi]
device = "apc mini mk2 notes"  # port name substring; empty = MIDI disabled
preset = "akai_apc_mini_mk2"   # built-in preset: akai_apc_mini_mk2 | akai_mpk_mini | novation_launchcontrol | generic | ""
# Connect to "apc mini mk2 control" instead for fader CCs (CC 48-55).
# Per-CC parameter overrides.  Uncomment and extend to remap individual knobs/faders.
# [midi.cc_map]
# 48 = "speed"
# 49 = "reactivity"
# Per-note action overrides.  Uncomment to remap individual pads.
# APC mini mk2 top row pads: 56=next 57=prev 58=random 59=pause 60=fullscreen
# Scene launch buttons:     112=next 113=prev 114=random 115=pause
# [midi.note_map]
# 56 = "next"
# 57 = "prev"

[dropins]
exclude = "none"
safe_mode = false

[recording]
auto_record = false
directory = "recordings"
capture_audio = true

[render]
internal_scale = 1

[overlays]
flash_messages = false
hud_auto_hide = false
#hud_timeout_s = 60.0

[hotkeys]
# F6 randomizes effect speed within this range (when effect exposes `speed`)
random_speed_min = 0.25
random_speed_max = 2.50
# F7 randomizes audio reactivity within this range
random_reactivity_min = 0.40
random_reactivity_max = 2.00
# Alt+[/] adjusts zoom; Shift+Z randomizes within this range
zoom_min = 0.1
zoom_max = 3.0
random_zoom_min = 0.30
random_zoom_max = 1.80

# ---------------------------------------------------------------------------
# RTMP streaming subsystem  (drop-ins/streaming-01)
# Streams the final single composed frame (not tiled multi-head mirror output)
# plus live audio to an RTMP endpoint using ffmpeg.
# ---------------------------------------------------------------------------
[streaming]
enabled = false
auto_start = false
provider = "rumble"
endpoint = "rtmp://live-api-s.rumble.com/live"
stream_key = ""
# rumble_endpoint = "rtmp://live-api-s.rumble.com/live"
# youtube_endpoint = "rtmp://a.rtmp.youtube.com/live2"
# custom_endpoint = "rtmp://your.rtmp.server/live"
# stream_url = ""              # full override URL; if set, endpoint/key are ignored
# ffmpeg_path = "ffmpeg"
# fps = 60
# video_codec = "libx264"
# preset = "veryfast"
# pixel_format = "yuv420p"
# include_audio = true
# audio_input_format = "pulse"
# audio_input_device = ""      # empty => default sink monitor (Pulse/PipeWire)
# audio_codec = "aac"
# audio_bitrate = "160k"

# ---------------------------------------------------------------------------
# Spotify metadata subsystem  (drop-ins/spotify-01)
# Polls playerctl/MPRIS for now-playing context used by HUD and Auto VJ.
# ---------------------------------------------------------------------------
[spotify]
enabled = true
player = "spotify"
poll_interval_s = 0.75
command_timeout_s = 0.25
features_file = "assets/audio/spotify_features.json"
live_corpus_file = "assets/training/corpus/live-corpus.jsonl"

# ---------------------------------------------------------------------------
# Spotify Web API auth/context (inside drop-ins/spotify-01)
# Adds OAuth/Web API queue + playlist context.
# ---------------------------------------------------------------------------
[spotify.web_api]
enabled = true
client_id = "9c8acb4afb744638917beab3b89ab369"
redirect_uri = "http://127.0.0.1:43879/callback"
scopes = [
	"user-read-playback-state",
	"user-read-currently-playing",
	"playlist-read-private",
	"playlist-read-collaborative",
]
token_store = "runtime/spotify-token.json"
poll_interval_s = 1.5
http_timeout_s = 1.0
queue_poll_every_n = 3
playlist_poll_every_n = 8
resolve_queue = true
resolve_playlist_context = true
# NOTE: local PKCE auth intentionally does not store a client secret here.

# Optional CTA ownership (F9) moved to streaming drop-in.
[streaming.cta]
enabled = true
duration_s = 4.5
cooldown_s = 0.0
mode = "cycle"               # cycle | random
seed = 0
# message format: "Text|Icon"
messages = [
	"Push the buttons!|👍",
	"Do the thangs!|🔔",
	"Share the love!|❤️ 📤",
]

# ---------------------------------------------------------------------------
# Post FX subsystem  (drop-ins/postfx-01)
# Global post-processing quick-hits + scroll-driven hue/rotation passes.
# ---------------------------------------------------------------------------
[postfx]
# enabled = true
# active_slot = 0
# hit_duration = 0.9
# slot1_duration = 1.15
# slot2_duration = 0.95
# slot3_duration = 0.90
# slot4_duration = 1.30
# slot5_duration = 1.05
# slot6_duration = 1.20
# slot7_duration = 0.95
# slot8_duration = 0.90
# slot9_duration = 0.85
# slot10_duration = 2.40
# hue_shift_timeout_s = 3.0
# hue_shift_step = 0.0277777778
# rotation_timeout_s = 3.0
# rotation_step_rad = 0.07

# ---------------------------------------------------------------------------
# Candy Frame overlay  (drop-ins/candy-frame-01)
# ---------------------------------------------------------------------------
[candy_frame]
enabled = true
start_enabled = false
inset_px = 77.0              # ~20% smaller frame than 96px default
intensity = 1.0
pattern_interval_s = 120.0
reverse_on_cycle = true
outer_fill_mode = "auto"     # auto | mirror_blur | reactive_gradient | off
outer_fill_rotate_s = 24.0
outer_fill_mix = 0.84
seed = 0

# ---------------------------------------------------------------------------
# Grand Finale controller  (drop-ins/grand-finale-01)
# End-of-set sequencer triggered by Ctrl+Alt+F or Auto VJ timed finale.
# ---------------------------------------------------------------------------
[grand_finale]
# intensity = 1.0
# blackout_s = 15.0

# ---------------------------------------------------------------------------
# Auto VJ  (drop-ins/auto-vj-01)
# Intelligent automation layer that drives the system like a human VJ:
# beat-aware effect swaps, drop hits, post-fx modulation, ping-pong, etc.
# ---------------------------------------------------------------------------
[auto_vj]
enabled = true
beat_tracker_engine = "v2"
#profile = "normie"          # chill | normie | raver | user (unset => normie preset)
auto_profile_enabled = true  # true = switch chill/normie/raver by BPM
auto_profile_chill_max_bpm = 105.0
auto_profile_raver_min_bpm = 128.0
#auto_profile_min_confidence = 0.45
#auto_profile_switch_cooldown_s = 20.0
# Runtime beat-prior sync stability (helps avoid BPM lock wobble when profile key thrashes)
#audio_profile_sync_hold_s = 12.0
#audio_profile_sync_min_confidence = 0.35

# Recommender-as-decider (default ON in code)
# profile_auto_reco_decider_enabled = true
# profile_auto_reco_decider_min_margin = 0.25
# profile_auto_reco_decider_min_confidence = 0.35
# profile_auto_reco_decider_cooldown_s = 20.0
# Fast override path (strong candidate can replace weak current profile)
# profile_auto_reco_decider_force_recommended_score = 2.25
# profile_auto_reco_decider_force_current_score_cap = 1.80
# profile_auto_reco_decider_force_cooldown_s = 6.0

# Recommendation confirmation gates
# profile_auto_reco_enabled = true
# profile_auto_reco_eval_interval_s = 8.0
# profile_auto_reco_window_s = 16.0
# profile_auto_reco_score_margin = 0.25
# profile_auto_reco_confirm_wins = 3
log_decisions = true
detector_log_interval_s = 1.0
# With auto_profile_enabled = false, explicit tuning keys below create manual
# USER mode layered over the selected base preset.
# show_duration_min    = 90    # optional full-set duration in minutes
# show_duration_s      = 5400  # legacy fallback in seconds (used only if *_min is unset)
# finale_auto_trigger  = true  # trigger grand finale automatically near show end
# finale_lead_s        = 45.0  # trigger window before show end (seconds)
#
# Phase 4 starter profile (conservative):
# - leave enabled=false until ready to test
# - cruise-only feel: slow swaps + gentle reactivity drift
# mode                  = "auto"       # Phase 3 treats auto as cruise behavior
# manual_grace_s        = 8.0          # ignore auto actions while user is driving
# min_effect_dwell_s    = 35.0         # conservative: slower effect changes
#max_effect_dwell_s    = 120.0
# reactivity_min        = 0.90         # gentle drift bounds
#reactivity_max        = 2.5
# reactivity_target_interval_s = 4.0
# reactivity_slew_per_s = 0.20
#cruise_effect_tags    = ["audio"]
# beat_threshold        = 0.55
# bpm_min               = 70
# bpm_max               = 180
# drop_energy_threshold = 0.78
#drop_cooldown_s       = 15.0
# allow_effect_swap     = true
# allow_postfx          = true
# allow_overlays        = true         # rainbow nova / screen burst / dancing unicorn
# allow_tweakables      = true         # reactivity / speed / zoom
# pingpong_a            = "Tron Grid"
#pingpong_b            = "Crystal Pyramids"
# pingpong_beats        = 4
# pingpong_auto_enabled = true         # auto-enter ping-pong only makes sense in raver mode
# pingpong_auto_bpm_min = 138.0        # require a fast locked groove before triggering
# pingpong_auto_trigger_chance = 0.35  # chance at each eligible cruise swap point
# pingpong_auto_min_swaps = 4          # auto ping-pong exits after a random swap budget
# pingpong_auto_max_swaps = 10
# log_decisions         = true        # write JSONL decision log per session
#postfx_cruise_interval_s = 25
postfx_cruise_slots = [1,2,3,7,9]
#postfx_drop_duration_s = 5
live_training_enabled = true
live_training_corpus_path = "assets/training/corpus/live-corpus.jsonl"

# Sequence corpus training (musical-time per-beat heartbeat + event keyframes)
sequence_training_enabled = true
sequence_training_corpus_path = "assets/training/corpus/sequence-corpus.jsonl"
# sequence_training_window_s = 2.0
# sequence_training_heartbeat_interval_s = 1.0

# ---------------------------------------------------------------------------
# Control Room operator window  (drop-ins/control-room-01)
# Dedicated VJ/operator monitor with program preview, transport, FX banks,
# tweakable controls, and an effect browser.
# ---------------------------------------------------------------------------
[control_room]
enabled = false
fullscreen = false       # borderless fullscreen on the chosen display (default true)
display_index = 2
#width = 1920
#height = 1080
show_preview = true
preview_scale = 0.25
theme = "dark"

# ---------------------------------------------------------------------------
# Keystroke logging  (unicornviz/keystroke_log.py)
# Appends one JSON line per keypress to logs/keystrokes-<date>.log.
# Each line includes: timestamp, key label, current effect, and beat context
# (bpm, beat_phase, energy, vj_mode) when Auto VJ is running.
# Useful for training Auto VJ behaviour models; default is OFF.
# ---------------------------------------------------------------------------
[keystrokes]
enabled = true

# ---------------------------------------------------------------------------
# Webcam system overlay  (drop-ins/webcam-01)
# Always-on camera PiP above every effect. Requires opencv-python-headless.
# ---------------------------------------------------------------------------
[webcam]
# enabled        = true            # false disables camera entirely
# device         = 0               # /dev/video index (Linux) or DirectShow (Windows)
# width          = 1280
# height         = 720
# fps            = 30
pip_position   = "hidden"  # top_left | top_center | top_right |
#                                   # left | center | right |
#                                   # bottom_left | bottom_center | bottom_right |
#                                   # fullscreen | hidden
# pip_scale      = 0.33            # fraction of viewport width (0.12 – 0.80)
# border_thickness = 4.0           # border/backplate thickness in pixels
# border_color   = [0.04, 0.72, 1.0, 0.28]  # RGBA 0.0 – 1.0
# treatment      = "neon"          # raw | neon | glitch | vintage | thermal
# cycle_interval = 0               # auto-cycle interval in s (0 = 30 s default)

# ---------------------------------------------------------------------------
# Image Showcase drop-in  (drop-ins/images-01)
# By default, loads bundled images from drop-ins/images-01/images/.
# Set image_dir to use a different folder instead; it is an override, not an
# additional search path.
# ---------------------------------------------------------------------------
[effects.ImageShowcase]
# image_dir = ""               # override path; empty = bundled images folder
preload_images = true        # true = warm image cache at startup
# speed = 1.0
mix_time = 15.0              # seconds per image
scale_when_framed = true
# candy_frame_disallow = true

# ---------------------------------------------------------------------------
# Video Showcase drop-in  (drop-ins/videos-01)
# By default, loads clips from drop-ins/videos-01/videos/.
# Set video_dir to use a different folder instead; it is an override, not an
# additional search path.
# ---------------------------------------------------------------------------
[effects.VideoShowcase]
# video_dir      = ""          # override path; empty = bundled videos folder
preload_videos = false        # true = open/prime clips at startup
# speed          = 1.0
mix_time       = 20.0        # seconds per clip
scale_when_framed = true
# candy_frame_disallow = true

# ---------------------------------------------------------------------------
# Hacker Terminal (drop-ins/hacker-terminal-01)
# Disable framed scaling because internal zoom/warp styles can expose static
# outer-clear regions that read as a fixed black matte.
# ---------------------------------------------------------------------------
[effects.HackerTerminal]
scale_when_framed = false
candy_frame_disallow = true

[effects.Fireworks]
scale_when_framed = false
candy_frame_disallow = true

[effects.Cube3D]
scale_when_framed = true

[effects.Vector]
scale_when_framed = true

[effects.Escher]
scale_when_framed = true

[effects.VanGogh]
scale_when_framed = true

[effects.Curtains]
scale_when_framed = true

# ---------------------------------------------------------------------------
# Sim Showcase drop-in  (drop-ins/sims-01)
# Supports public USD scene packs (robotics/simulation datasets).
# Provide one folder in scene_dir or multiple comma-separated folders in
# scene_dirs. Only .usda/.usdc/.usdz files are loaded.
# ---------------------------------------------------------------------------
# [effects.SimShowcase]
# speed = 1.0
# mix_time = 14.0
# camera_energy = 1.0
# scene_dir = "drop-ins/sims-01/scenes"
# scene_dirs = "drop-ins/sims-01/scenes,assets/robotics-usd,assets/sims"

# ---------------------------------------------------------------------------
# ProjectM preset host drop-in  (drop-ins/projectm-01)
# Requires an installed libprojectM runtime and a preset pack containing
# .milk / .prjm files. This Phase 1 drop-in scans preset directories, renders
# via the current Unicorn Viz GL context, and supports Ctrl+N/P/R preset
# switching while the effect is active.
# ---------------------------------------------------------------------------
[effects.ProjectMEffect]
speed = 1.0
preset_duration = 20.0
smooth_transition = true
lock_preset = false
start_clean = false
beat_sensitivity = 1.0
fps_hint = 60
projectm_library = ""
preset_dirs = "drop-ins/projectm-01/presets"
texture_dirs = ["drop-ins/projectm-01/presets/presets-milkdrop-texture-pack/textures", "drop-ins/projectm-01/textures"]
start_preset = ""

# Dark-preset auto-skip: if average brightness after dark_skip_after seconds
# is below dark_brightness_threshold (0.0-1.0), the preset is skipped.
# Set dark_skip_enabled = false to turn this off entirely.
dark_skip_enabled = true
dark_skip_after = 1.0
dark_brightness_threshold = 0.02

# ---------------------------------------------------------------------------
# Beat tracker engine selection (inside [auto_vj] section)
#
# beat_tracker_engine = "v2"       — ACF + phase-locked oscillator (default)
# beat_tracker_engine = "legacy"   — IOI-median estimator (fallback)
#
# Optional v2 analysis-mode guardrails (disabled by default):
# analysis_mode_enabled = true
# analysis_map_beats = 64
# analysis_region_min_beats = 8
# analysis_region_tol = 0.20
# analysis_region_confidence_min = 0.58
# analysis_downbeat_confidence_min = 0.55
#
# To enable, add the key inside your [auto_vj] block, e.g.:
#   [auto_vj]
#   beat_tracker_engine = "v2"
# ---------------------------------------------------------------------------
# beat_tracker_engine = "v2"

# ---------------------------------------------------------------------------
# projectM affinity & preset behavior (inside [auto_vj] section)
#
# projectm_affinity       — Per-swap probability (0..1) that the director
#                           biases toward ProjectM Presets when available.
#                           0 = disabled. Profile defaults: chill=0.15,
#                           normie=0.25, raver=0.30.
# projectm_dwell_mult     — Dwell-time multiplier applied when projectM wins
#                           an affinity pick (profile defaults ~2.0–2.5).
# projectm_preset_min_interval_s — Minimum seconds between Auto VJ–driven
#                           preset changes inside projectM (dance behavior).
# projectm_preset_on_event_chance — Probability (0..1) of triggering a
#                           random preset on musical events (drop/impact/
#                           build/climax) while projectM is active.
#
# projectm_preset_pingpong_enabled — Raver-only: allow preset-level ping-pong
#                           inside projectM (bouncing between two presets).
# projectm_preset_pingpong_beats   — Beats between preset swaps.
# projectm_preset_pingpong_min_swaps / max_swaps — Budget range.
#
# Post-FX ping-pong (raver only, layered on top of effect/preset ping-pong):
# postfx_pingpong_enabled         — Enable the parallel postfx oscillator.
# postfx_pingpong_beats           — Beats between post-FX slot swaps.
# postfx_pingpong_min_swaps / max_swaps — Budget range per run.
# postfx_pingpong_trigger_chance  — Probability of starting a run on beat.
#
# Example (add inside your [auto_vj] block):
#   [auto_vj]
#   projectm_affinity = 0.30
#   projectm_dwell_mult = 2.0
#   projectm_preset_min_interval_s = 6.0
#   projectm_preset_on_event_chance = 0.75
#   projectm_preset_pingpong_enabled = true
#   projectm_preset_pingpong_beats = 4
#   postfx_pingpong_enabled = true
#   postfx_pingpong_trigger_chance = 0.40
# ---------------------------------------------------------------------------
