name: Installer Smoke

on:
  schedule:
    # Nightly at 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-dry-run:
    name: Lint + dry-run installer scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n install.sh \
            tools/install/lib.sh \
            tools/install/uninstall_linux.sh \
            tools/install_linux.sh \
            tools/packaging/fetch_runtime.sh \
            tools/packaging/stage_payload.sh \
            tools/packaging/build_native.sh

      - name: Lint installer scripts (shellcheck)
        run: |
          shellcheck install.sh \
            tools/install/lib.sh \
            tools/install/uninstall_linux.sh \
            tools/install_linux.sh \
            tools/packaging/fetch_runtime.sh \
            tools/packaging/stage_payload.sh \
            tools/packaging/build_native.sh

      - name: Smoke test payload stager
        run: |
          chmod +x tools/packaging/stage_payload.sh
          ./tools/packaging/stage_payload.sh --dest /tmp/uv-payload
          test -d /tmp/uv-payload/unicornviz
          test -f /tmp/uv-payload/pyproject.toml
          test -f /tmp/uv-payload/requirements.txt
          test ! -e /tmp/uv-payload/.git
          test ! -e /tmp/uv-payload/drop-ins
          test ! -e /tmp/uv-payload/docs

      - name: Smoke test dev installer dry-run (bundled runtime)
        run: |
          chmod +x tools/install_linux.sh
          ./tools/install_linux.sh --dry-run --no-deps

      - name: Smoke test dev installer dry-run (system python)
        run: |
          ./tools/install_linux.sh --dry-run --no-deps --system-python --python python3

      - name: Smoke test release installer dry-run
        run: |
          chmod +x install.sh
          ./install.sh --dry-run --version 0.1.0 --no-deps

      - name: Smoke test runtime fetcher help
        run: |
          chmod +x tools/packaging/fetch_runtime.sh
          ./tools/packaging/fetch_runtime.sh --help

      - name: Smoke test uninstall helper dry-run
        run: |
          chmod +x tools/install/uninstall_linux.sh
          ./tools/install/uninstall_linux.sh --dry-run --prefix /tmp/unicorn-viz-smoke

  real-install:
    name: Real install (${{ matrix.image }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y git curl ca-certificates sudo tar
          - image: fedora:41
            bootstrap: dnf install -y git curl ca-certificates sudo tar
          - image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm git curl ca-certificates tar
    steps:
      - name: Bootstrap checkout prerequisites
        run: ${{ matrix.bootstrap }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Real install with bundled runtime
        run: |
          chmod +x tools/install_linux.sh
          ./tools/install_linux.sh

      - name: Assert install is healthy (assets resolve, core deps import)
        run: |
          # Same env the shipped launchers set; --help cannot catch a bad APP_ROOT.
          UNICORNVIZ_APP_ROOT="$PWD" ./.venv/bin/unicorn-viz --self-test

  native-package-smoke:
    name: Build rpm+deb, install in clean containers, --self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev build-essential rpm >/dev/null
          sudo gem install --no-document fpm >/dev/null

      - name: Build rpm + deb via release.sh (bundled runtime, curated payload)
        run: |
          chmod +x tools/packaging/*.sh
          tools/packaging/release.sh --formats rpm,deb --dest /tmp/uv-stage --base-url http://localhost
          ls -lh /tmp/uv-stage/*/

      - name: Install the rpm in a clean Fedora container and self-test
        run: |
          OUT="$(ls -d /tmp/uv-stage/*/ | head -n1)"
          docker run --rm -v "$OUT:/pkg:ro" registry.fedoraproject.org/fedora:41 bash -euo pipefail -c '
            dnf -q install -y /pkg/*.rpm >/dev/null
            unicorn-viz --self-test'

      - name: Install the deb in a clean Ubuntu container and self-test
        run: |
          OUT="$(ls -d /tmp/uv-stage/*/ | head -n1)"
          docker run --rm -v "$OUT:/pkg:ro" public.ecr.aws/ubuntu/ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/*.deb >/dev/null
            unicorn-viz --self-test'

  windows-portable-and-installer:
    name: Windows portable + Inno Setup installer, silent install, --self-test
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host Python for cross-install and zipping
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the portable zip and leave the assembled tree for ISCC
        run: |
          python -m pip install --quiet --upgrade pip
          bash tools/packaging/build_windows_portable.sh --output-dir dist --payload-out build/windows
          ls -lh dist/

      - name: Portable zip smoke (unzip, run the launcher headlessly)
        run: |
          mkdir -p /tmp/uv-portable && cd /tmp/uv-portable
          python -m zipfile -e "$(ls "$GITHUB_WORKSPACE"/dist/UnicornViz-Portable-*-win-x64.zip)" .
          cmd //c "UnicornViz\unicorn-viz.cmd --self-test"

      - name: Compile the installer (Inno Setup is preinstalled on windows-2022)
        run: |
          VERSION="$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" unicornviz/__init__.py | head -n1)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${VERSION}" "/DPayloadDir=..\\..\\build\\windows\\UnicornViz" packaging/windows/UnicornViz.iss
          ls -lh dist/UnicornViz-Setup-*.exe

      - name: Silent install, then --self-test through the installed launcher
        run: |
          SETUP="$(ls dist/UnicornViz-Setup-*.exe)"
          "$SETUP" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\\uv-installed" /LOG="C:\\uv-setup.log"
          ls "C:/uv-installed"
          cmd //c "C:\\uv-installed\\unicorn-viz.cmd --self-test"

      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/UnicornViz-Portable-*-win-x64.zip
            dist/UnicornViz-Setup-*.exe
